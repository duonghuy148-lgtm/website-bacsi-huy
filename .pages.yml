# Cấu hình trang quản trị Pages CMS (https://app.pagescms.org)
# Bác sĩ đăng nhập bằng GitHub, viết bài trên giao diện, bấm Lưu là web tự cập nhật.
media:
  input: src/assets/images
  output: /assets/images

content:
  - name: posts
    label: Bài viết
    type: collection
    path: src/bai-viet
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, category, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Tiêu đề
        type: string
        required: true
      - name: description
        label: Tóm tắt (1–2 câu, hiện ở trang chủ và Google)
        type: text
        required: true
      - name: category
        label: Chuyên mục
        type: select
        options:
          values: [Thai sản, Phẫu thuật phụ khoa, Phụ khoa, Hỏi đáp, Bản tin Y khoa]
      - name: date
        label: Ngày đăng
        type: date
      - name: updated
        label: Ngày cập nhật (chỉ điền khi sửa lại bài cũ)
        type: date
      - name: image
        label: Ảnh đại diện bài viết (ngang, khoảng 1200×750)
        type: image
      - name: tiktok
        label: Link video TikTok (dán link video, web tự nhúng lên đầu bài)
        type: string
      - name: draft
        label: Lưu nháp (chưa hiện trên web)
        type: boolean
      - name: sample
        label: Bài mẫu chưa duyệt (hiện dòng cảnh báo)
        type: boolean
      - name: body
        label: Nội dung
        type: rich-text

  - name: site
    label: Thông tin bác sĩ và phòng khám
    type: file
    path: src/_data/site.json
    fields:
      - { name: doctorName, label: Tên hiển thị, type: string }
      - { name: hospital, label: Bệnh viện công tác, type: string }
      - { name: clinicName, label: Tên phòng khám tư, type: string }
      - { name: clinicAddress, label: Địa chỉ phòng khám, type: string }
      - { name: phone, label: Số điện thoại hiển thị, type: string }
      - { name: zalo, label: Số Zalo (chỉ số, ví dụ 0912345678), type: string }
      - { name: email, label: Email, type: string }
      - { name: experienceYears, label: Số năm kinh nghiệm, type: string }
      - { name: licenseNumber, label: Số chứng chỉ hành nghề, type: string }
      - { name: clinicLicense, label: Số giấy phép hoạt động phòng khám, type: string }
      - { name: tiktok, label: Link kênh TikTok, type: string }
      - { name: tiktokHandle, label: Tên kênh TikTok, type: string }
      - { name: tiktokFollowers, label: Số người theo dõi TikTok (ví dụ 120K), type: string }
      - { name: facebook, label: Link Facebook, type: string }
      - { name: mapLink, label: Link Google Maps của phòng khám, type: string }
      - { name: hoursConfirmed, label: Giờ khám đã chính xác (bật để hiện trạng thái mở cửa), type: boolean }
      - { name: bio, label: Tiểu sử ngắn, type: text }
      - { name: bookingEndpoint, label: Link nhận form đặt lịch (Google Apps Script), type: string }
